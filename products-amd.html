<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMD Ryzen 9 - Dy Gaming Store</title>
<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/544d79f6c0.js" crossorigin="anonymous"></script>
</head>

<body>
<header>
  <div class="logo">Dy Gaming Store</div>
  <nav>
    <ul class="nav-links">
      <li><a href="shop.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="privacy-policy.html">Privacy Policy</a></li>
    </ul>
  </nav>
  <div class="cart-container">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-count">0</span>
    <div class="cart-dropdown">
      <div class="cart-items">
        <!-- Cart items will be dynamically added here -->
      </div>
      <div class="cart-total">
        <span>Total: $<span id="cart-total-amount">0.00</span></span>
      </div>
      <button class="checkout-btn">Checkout</button>
    </div>
  </div>
  <a href="login.html" class="login-btn"><i class="fa-solid fa-user"></i> Log in / Sign up</a>
  <a href="GGDy.html" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>
  <div class="menu-toggle"><i class="fa-solid fa-bars"></i></div>
</header>

<main class="product-list">
  <div class="product-card">
    <img src="images/amdcpu.png" alt="AMD Ryzen 9">
    <div class="product-info">
      <h3>AMD Ryzen 9 7950X3D</h3>
      <p class="description">16 Cores 32 Threads<br>
Up to 5.7 GHz<br>
144MB Cache<br>
PCIe 5.0<br>
DDR5 Support<br>
AM5 Socket<br>
3D V-Cache Technology</p>
      <span class="price">$699.99</span>
      <button class="add-to-cart">Add to Cart</button>
    </div>
  </div>
</main>

<footer>
  <p>&copy; 2025 Dy Gaming Store. All Rights Reserved</p>
  <i class="fa-brands fa-facebook"></i>
  <i class="fa-brands fa-whatsapp"></i>
  <i class="fa-brands fa-instagram"></i>
  <i class="fa-brands fa-discord"></i>
</footer>

<script src="script.js"></script>
</body>
</html>
